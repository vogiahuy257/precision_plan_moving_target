%YAML:1.0

# =========================
# VINS-MONO REALTIME ODOMETRY TEST
# Camera + PX4 IMU
# =========================

imu_topic: "/imu0"
image_topic: "/camera/image"

output_path: "/home/pihuy/precision_plan_moving_target/vins_output/"

# =========================
# Camera model
# =========================

model_type: PINHOLE
camera_name: camera

image_width: 640
image_height: 480

distortion_parameters:
   k1: -0.353426
   k2: 0.132852
   p1: -0.002342
   p2: -0.000467

projection_parameters:
   fx: 768.59071
   fy: 767.65667
   cx: 312.58459
   cy: 213.52393

# =========================
# Camera-IMU extrinsic
# =========================

estimate_extrinsic: 0

# extrinsicRotation: !!opencv-matrix
#    rows: 3
#    cols: 3
#    dt: d
#    data: [ -0.99059949400320702, 0.13017021372302159, -0.042051848233979512,
#            0.0834971229730226, 0.81886920982567013, 0.5678744999158799,
#            0.1083553087569719, 0.55902498393075917, -0.82204026325077062 ]

# extrinsicTranslation: !!opencv-matrix
#    rows: 3
#    cols: 1
#    dt: d
#    data: [ 0.0046613610673365106,
#            -0.011192732279155069,
#            -0.095092993982251101 ]

# extrinsicRotation: !!opencv-matrix
#    rows: 3
#    cols: 3
#    dt: d
#    data: [ -0.99059949400320702, 0.13017021372302159,-0.042051848233979512, 
#           0.0834971229730226, 0.81886920982567013, 0.5678744999158799, 
#           0.1083553087569719, 0.55902498393075917,-0.82204026325077062 ]
# extrinsicTranslation: !!opencv-matrix
#    rows: 3
#    cols: 1
#    dt: d
#    data: [ 0.0046613610673365106, -0.011192732279155069,
#        -0.095092993982251101 ]

extrinsicRotation: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [-0.99059949400320702, 0.13017021372302159, -0.042051848233979512, 
         0.0834971229730226, -0.81886920982567013, 0.5678744999158799,
          0.1083553087569719, 0.55902498393075917, -0.82204026325077062]

extrinsicTranslation: !!opencv-matrix
   rows: 3
   cols: 1
   dt: d
   data: [0.0046613610673365106, -0.011192732279155069, -0.095092993982251101]

# =========================
# Feature tracker
# =========================

max_cnt: 120
min_dist: 12
freq: 30
F_threshold: 1.0
show_track: 0
equalize: 1
fisheye: 0

# =========================
# Estimator solver
# =========================

# 30 Hz tương ứng mỗi frame khoảng 0.033s.
# Để 0.03 giúp realtime hơn.
max_solver_time: 0.03
max_num_iterations: 6
keyframe_parallax: 10.0

# =========================
# IMU noise
# =========================
# Giá trị cũ 0.000005 quá nhỏ, làm VINS tin IMU gần như tuyệt đối.
# Bộ giá trị này thực tế hơn để test với PX4 IMU.
acc_n: 0.00008
gyr_n: 0.00004
acc_w: 0.00001
gyr_w: 0.00001
g_norm: 9.805

# =========================
# Loop closure / pose graph
# =========================
# Khi test odometry realtime lần đầu, phải tắt.
# Nếu bật sớm, pose có thể bị nhảy do relocalization hoặc map cũ.

loop_closure: 0
load_previous_pose_graph: 0
fast_relocalization: 0
pose_graph_save_path: "/home/pihuy/precision_plan_moving_target/vins_output/pose_graph/"

# =========================
# Time delay camera-IMU
# =========================

estimate_td: 0
td: 0.000

# =========================
# Rolling shutter
# =========================

rolling_shutter: 0
rolling_shutter_tr: 0

# =========================
# Save / visualization
# =========================

save_image: 0
visualize_imu_forward: 0
visualize_camera_size: 0.4
