precision_land:
  ros__parameters:
    # =========================
    # Nhóm topic ROS2 đầu vào/đầu ra
    # =========================
    topics:
      # Pose mục tiêu đã qua Kalman, hệ NED
      target_pose: "/KalmanFilter/target_pose_est_NED"

      # Velocity mục tiêu đã qua Kalman, hiện đang truyền bằng PoseStamped
      target_velocity: "/KalmanFilter/target_velocity_est_NED"

      # Trạng thái PX4 nhận biết đã chạm đất hay chưa
      vehicle_land_detected: "/fmu/out/vehicle_land_detected"

      # Local position của PX4, dùng lấy dist_bottom và z local
      vehicle_local_position: "/fmu/out/vehicle_local_position"

      # Topic gửi lệnh chuỗi điều khiển gimbal
      gimbal_command: "/gimbal/cmd/sequence"

      # Topic nhận attitude hiện tại của gimbal
      gimbal_attitude: "/gimbal/state/attitude"
  
    # =========================
    # Tham số controller XY
    # =========================

    # Deadband lỗi XY, lỗi nhỏ hơn ngưỡng này sẽ coi như 0 để giảm rung
    PID_deadband: 0.05

    # Thời gian tối đa cho phép không nhận được pose target trước khi coi là mất mục tiêu
    target_timeout: 3.0

    # Gain P của controller XY
    descent_kp_pid: 1.0

    # Gain I của controller XY
    descent_ki_pid: 0.0

    # Gain D của controller XY
    descent_kd_pid: 0.0

    # Giới hạn vận tốc ngang lớn nhất mà controller XY được phép xuất ra
    descent_max_velocity: 10.0

    # Giới hạn tốc độ thay đổi vận tốc ngang để làm mượt lệnh điều khiển
    slew_acc: 8.5

    # =========================
    # Tham số controller Z
    # =========================

    # Khi xuống thấp hơn ngưỡng này thì dùng chế độ hạ gần đất
    land_zone_z: 0.5

    # Vận tốc hạ cố định khi đã vào vùng gần đất
    descent_vel: 0.5

    # Bán kính sai số ngang cho phép để bắt đầu hạ
    # Nếu lệch ngang lớn hơn giá trị này thì controller Z sẽ giữ không hạ
    descent_gate_radius: 0.3

    # Vận tốc hạ nhỏ nhất khi đang ở trong gate
    vmin: 0.45

    # Vận tốc hạ lớn nhất khi target nằm gần tâm
    vmax: 0.8

    # =========================
    # Tham số prediction
    # =========================

    # Có dùng sai số dự đoán tương lai hay không
    use_predictive_error: true

    # Giới hạn trên của thời gian dự đoán tương lai
    prediction_dt_max: 0.75

    # Cộng thêm phần lead time cố định để bù trễ xử lý và phản ứng hệ thống
    control_extra_lead_sec: 0.25

    # Hệ số dùng gia tốc UAV trong mô hình prediction
    predictive_acc_gain: 0.0

    # Hệ số low-pass cho gia tốc UAV ước lượng từ velocity
    predictive_acc_lpf_alpha: 0.4

    # Giới hạn độ lớn gia tốc UAV ước lượng để tránh nhiễu đột biến
    predictive_acc_max: 4.0

    # =========================
    # Tham số logic disarm
    # =========================
    disarm:

      # Chế độ disarm: "enabled" để kích hoạt logic disarm, "disabled" để tắt hoàn toàn và không can thiệp vào quá trình disarm của PX4
      mode: "enabled"                 # "enabled" | "disabled"

      # Chọn nguồn độ cao cho logic disarm
      # "dist_bottom": dùng cảm biến khoảng cách xuống đất từ PX4
      # "local_position_z": dùng z của vehicle_local_position
      altitude_source: "local_position_z"

      # Chỉ cho phép disarm khi độ cao nhỏ hơn hoặc bằng ngưỡng này
      height: 0.02

      # Chỉ cho phép disarm khi sai số ngang đủ nhỏ
      lateral_error_threshold: 10.0

      # Chỉ cho phép disarm khi tốc độ hạ đủ nhỏ để tránh cắt motor quá mạnh
      vertical_speed_threshold: 10.0

      # Nếu PX4 đã báo landed thì cho phép disarm ngay
      allow_landed_immediate: true
    
    # =========================
    # Tham số debug
    # =========================
    # Bật/tắt logger debug, sẽ log ra file trong thư mục precisionland_logs/ 
    debug_logger: true