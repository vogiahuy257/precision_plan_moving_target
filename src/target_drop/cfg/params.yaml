/**:
  ros__parameters:
    estimator:
      # kf = CV, ekf = CTRA
      model: "kf"

    topics:
      target_pose: "/KF/target_pose_est_NED"
      target_velocity: "/KF/target_velocity_est_NED"
      target_covariance: "/KF/target_covariance_NE"
      target_process_noise: "/KF/process_noise"
      target_motion: "/EKF/target_motion"
      target_state: "/Aruco/target_state"
      vehicle_local_position: "/fmu/out/vehicle_local_position_v1"

    # XY controller tracks the OPTIMAL RELEASE POINT.
    controller:
      kp: 0.8
      ki: 0.02
      kd: 0.2
      deadband_m: 0.08
      max_velocity_m_s: 100.0
      slew_acc_m_s2: 0.88

    altitude:
      release_height_m: 3.0
      tolerance_m: 0.15
      kp: 0.4
      slew_acc_m_s2: 0.6
      descent_gate_radius_m: 0.30
      descent_min_m_s: 0.30
      descent_max_m_s: 0.45

    payload:
      wind_x_m_s: 0.0
      wind_y_m_s: 0.0
      wind_z_m_s: 0.0
      mass_kg: 0.5
      cd: 1.0
      area_m2: 0.01
      rho_air: 1.225

      # Numerical resolution of the quadratic-drag ODE only.
      # This does NOT delay execution and does NOT cap fall time.
      integration_step_s: 0.005

    release:
      # Immediate gate: release becomes true as soon as all limits are satisfied.
      max_error_m: 0.35
      max_sigma_m: 0.20

      payload_sigma_x_m: 0.0
      payload_sigma_y_m: 0.0
