kalman_filter:
  ros__parameters:
    debug: false
    debug_csv_path: "kalman_logs/"
    pose_timeout_s: 3.0

    topics.input_target_pose: "/Aruco/target_pose_FRD"
    topics.reset_command: "/Aruco/target_state"
    topics.target_valid: "/target_valid"
    topics.vehicle_odometry: "/fmu/out/vehicle_odometry"
    topics.vehicle_local_position: "/fmu/out/vehicle_local_position_v1"
    topics.relative_position_raw: "/KalmanFilter/target_pose_NED"
    topics.relative_position_predicted: "/KalmanFilter/target_pose_est_NED"
    topics.relative_velocity: "/KalmanFilter/target_velocity_est_NED"

    frame_id: "map"

    # =========================
    # Process noise Q
    # Gia toc bat dinh cua target
    # Tang q_acc -> Kalman bam measurement nhanh hon nhung co the nhieu hon
    # Giam q_acc -> output muot hon nhung de tre pha hon
    # =========================
    q_acc_x: 0.018
    q_acc_y: 0.018
    q_acc_z: 0.00018

    # =========================
    # Measurement noise R co ban
    # Day la phuong sai cua phep do position sau transform camera -> world
    # Gia tri cang lon thi Kalman cang it tin camera
    # =========================
    r_pos_x: 0.008
    r_pos_y: 0.008
    r_pos_z: 0.000012

    dynamic_r.enable: true
    dynamic_r.near_range_m: 0.7
    dynamic_r.near_noise_gain: 0.08
    dynamic_r.max_extra_r_xy: 0.20
    dynamic_r.min_range_m: 0.1

    transform.mount_mode: "belly_fixed_camera"
    transform.camera_offset_x: 0.0
    transform.camera_offset_y: 0.0
    transform.camera_offset_z: -0.1